<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Database shard routing and controlled rebalancing</title>
  <desc id="desc">A tenant identifier is hashed to a logical bucket, then a bucket map routes it to a database shard. Event time selects a local table partition. On scale-out, a selected bucket is copied and validated on a new shard before its routing map is switched; unrelated buckets keep their owners.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="move-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#fbbf24"/></marker>
    <style>
      .bg{fill:#0a0a0a}.panel{fill:#111;stroke:#404040;stroke-width:1.5}.node{fill:#1c1c1c;stroke:#525252;stroke-width:1.3}.moved{fill:#29200e;stroke:#fbbf24;stroke-width:1.5}.label{fill:#fff;font:600 15px system-ui,sans-serif}.sub{fill:#a3a3a3;font:12px system-ui,sans-serif}.title{fill:#fff;font:700 20px system-ui,sans-serif}.section{fill:#22d3ee;font:700 13px system-ui,sans-serif;letter-spacing:.5px}.line{stroke:#22d3ee;stroke-width:2;fill:none;marker-end:url(#arrow)}.move{stroke:#fbbf24;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#move-arrow)}
    </style>
  </defs>
  <rect class="bg" width="1000" height="470" rx="18"/>
  <text class="title" x="28" y="36">Route by key; rebalance ownership deliberately</text>
  <text class="section" x="30" y="74">REQUEST ROUTING</text>
  <rect class="node" x="30" y="91" width="150" height="70" rx="10"/>
  <text class="label" x="52" y="119">Tenant request</text>
  <text class="sub" x="50" y="141">tenant_id + event_time</text>
  <rect class="node" x="224" y="91" width="158" height="70" rx="10"/>
  <text class="label" x="245" y="119">Hash tenant_id</text>
  <text class="sub" x="247" y="141">stable key → bucket</text>
  <rect class="node" x="428" y="91" width="170" height="70" rx="10"/>
  <text class="label" x="451" y="119">Bucket map</text>
  <text class="sub" x="446" y="141">logical bucket → shard</text>
  <rect class="node" x="644" y="91" width="150" height="70" rx="10"/>
  <text class="label" x="671" y="119">Shard B</text>
  <text class="sub" x="662" y="141">owns this bucket</text>
  <rect class="node" x="840" y="91" width="130" height="70" rx="10"/>
  <text class="label" x="858" y="119">Local table</text>
  <text class="sub" x="858" y="141">partition by time</text>
  <path class="line" d="M180 126H220"/>
  <path class="line" d="M382 126H424"/>
  <path class="line" d="M598 126H640"/>
  <path class="line" d="M794 126H836"/>
  <text class="sub" x="643" y="184">event_time selects a range partition within the shard</text>

  <text class="section" x="30" y="226">SCALE-OUT: MOVE ONE BUCKET, NOT THE WHOLE DATASET</text>
  <rect class="panel" x="30" y="244" width="570" height="185" rx="12"/>
  <text class="label" x="52" y="271">Before</text>
  <rect class="node" x="55" y="288" width="245" height="108" rx="10"/>
  <text class="label" x="78" y="316">Shard A</text>
  <rect class="node" x="78" y="330" width="85" height="46" rx="7"/>
  <text class="sub" x="95" y="358">Bucket 1</text>
  <rect class="moved" x="177" y="330" width="98" height="46" rx="7"/>
  <text class="sub" x="190" y="358">Bucket 2</text>
  <rect class="node" x="342" y="288" width="225" height="108" rx="10"/>
  <text class="label" x="365" y="316">Shard B</text>
  <rect class="node" x="372" y="330" width="85" height="46" rx="7"/>
  <text class="sub" x="389" y="358">Bucket 3</text>
  <rect class="moved" x="468" y="330" width="80" height="46" rx="7"/>
  <text class="sub" x="479" y="358">Bucket 4</text>

  <path class="move" d="M600 335H655"/>
  <text class="sub" x="603" y="317">copy + validate</text>

  <rect class="panel" x="660" y="244" width="310" height="185" rx="12"/>
  <text class="label" x="681" y="271">After map cutover</text>
  <rect class="node" x="674" y="300" width="84" height="78" rx="9"/>
  <text class="sub" x="691" y="327">Shard A</text>
  <text class="sub" x="691" y="352">Bucket 1</text>
  <rect class="node" x="771" y="300" width="84" height="78" rx="9"/>
  <text class="sub" x="788" y="327">Shard B</text>
  <text class="sub" x="788" y="352">Buckets 3, 4</text>
  <rect class="moved" x="868" y="300" width="84" height="78" rx="9"/>
  <text class="sub" x="884" y="327">Shard C</text>
  <text class="sub" x="884" y="352">Bucket 2</text>
  <text class="sub" x="31" y="451">Hashing determines placement; migration tooling copies data, captures concurrent writes, verifies, then switches ownership.</text>
</svg>
