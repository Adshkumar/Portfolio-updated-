<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="epoll-title epoll-desc">
  <title id="epoll-title">Linux I/O multiplexing: select vs epoll</title>
  <desc id="epoll-desc">Comparing O(N) linear descriptor scanning in select/poll with O(1) event-driven waitqueues and ready lists in epoll.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker>
    <style>
      .bg{fill:#0a0a0a}.card{fill:#141414;stroke:#404040;stroke-width:1.5}.title{fill:#fff;font:700 20px system-ui,sans-serif}.header{fill:#38bdf8;font:700 16px system-ui,sans-serif}.txt{fill:#e5e5e5;font:500 13px system-ui,sans-serif}.sub{fill:#a3a3a3;font:12px system-ui,sans-serif}.tag-red{fill:#f87171;font:600 12px system-ui,sans-serif}.tag-green{fill:#4ade80;font:600 12px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="960" height="300" rx="18"/>
  <text class="title" x="30" y="38">Kernel I/O Multiplexing: select/poll vs epoll Event Loop</text>

  <!-- select/poll Card -->
  <rect class="card" x="40" y="65" width="410" height="205" rx="12"/>
  <text class="header" x="60" y="98">Legacy: select() and poll() — O(N)</text>
  <text class="txt" x="60" y="125">• Copies entire FD array into kernel on EVERY call</text>
  <text class="txt" x="60" y="148">• Kernel iterates linearly through all N descriptors</text>
  <text class="txt" x="60" y="171">• User space must iterate through array to find ready FDs</text>
  <text class="tag-red" x="60" y="210">High CPU overhead at 10,000+ connections</text>
  <text class="sub" x="60" y="235">select() strictly capped at 1024 FDs (FD_SETSIZE)</text>

  <!-- epoll Card -->
  <rect class="card" x="510" y="65" width="410" height="205" rx="12"/>
  <text class="header" x="530" y="98">Modern: epoll (epoll_create / wait) — O(1)</text>
  <text class="txt" x="530" y="125">• Descriptors registered once in kernel Red-Black tree</text>
  <text class="txt" x="530" y="148">• Hardware NIC interrupts wake socket waitqueues</text>
  <text class="txt" x="530" y="171">• Kernel populates an in-memory ready list (doubly linked)</text>
  <text class="tag-green" x="530" y="210">Returns ONLY actively triggered file descriptors</text>
  <text class="sub" x="530" y="235">Scales effortlessly to millions of idle WebSockets</text>
</svg>
