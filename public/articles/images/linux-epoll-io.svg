<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="epoll-title epoll-desc">
  <title id="epoll-title">How select, poll, and epoll find ready file descriptors</title>
  <desc id="epoll-desc">Select and poll receive a descriptor set on each wait and scan it for readiness. Epoll keeps registrations in a persistent kernel instance and returns ready events, which can avoid rescanning a large mostly idle set. All APIs still incur costs related to descriptors, events, and application work.</desc>
  <defs>
    <marker id="epoll-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{fill:#0f172a;font:700 27px system-ui,sans-serif}.heading{fill:#0f172a;font:700 20px system-ui,sans-serif}.label{fill:#334155;font:600 16px system-ui,sans-serif}.body{fill:#475569;font:15px system-ui,sans-serif}.small{fill:#64748b;font:14px system-ui,sans-serif}.scan{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.ready{fill:#dcfce7;stroke:#22c55e;stroke-width:2}.idle{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}.arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#epoll-arrow)}.green{fill:#15803d;font:700 15px system-ui,sans-serif}.amber{fill:#a16207;font:700 15px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="570" rx="24"/>
  <text class="title" x="40" y="52">The key question: how does the kernel find ready sockets?</text>
  <text class="body" x="40" y="82">“Ready” means an I/O operation can likely make progress without blocking; it does not mean a full request is ready.</text>

  <rect class="panel" x="36" y="112" width="510" height="330" rx="18"/>
  <text class="heading" x="64" y="153">select() / poll()</text>
  <text class="body" x="64" y="184">The application supplies the watched set again</text>
  <text class="body" x="64" y="208">on each wait. The kernel checks that set.</text>
  <rect class="idle" x="72" y="244" width="88" height="48" rx="10"/><text class="label" x="116" y="274" text-anchor="middle">fd 1</text>
  <rect class="idle" x="172" y="244" width="88" height="48" rx="10"/><text class="label" x="216" y="274" text-anchor="middle">fd 2</text>
  <rect class="ready" x="272" y="244" width="88" height="48" rx="10"/><text class="label" x="316" y="274" text-anchor="middle">fd 3</text>
  <rect class="idle" x="372" y="244" width="88" height="48" rx="10"/><text class="label" x="416" y="274" text-anchor="middle">fd N</text>
  <path class="arrow" d="M104 311V337H433V311"/>
  <rect class="scan" x="108" y="347" width="326" height="50" rx="12"/>
  <text class="label" x="271" y="378" text-anchor="middle">scan supplied descriptors → report ready fd 3</text>
  <text class="amber" x="64" y="423">Work tends to grow with the number of watched descriptors.</text>

  <rect class="panel" x="574" y="112" width="510" height="330" rx="18"/>
  <text class="heading" x="602" y="153">epoll</text>
  <text class="body" x="602" y="184">Register interest once; wait for ready events</text>
  <text class="body" x="602" y="208">from the persistent epoll instance.</text>
  <rect class="idle" x="610" y="244" width="88" height="48" rx="10"/><text class="label" x="654" y="274" text-anchor="middle">fd 1</text>
  <rect class="idle" x="710" y="244" width="88" height="48" rx="10"/><text class="label" x="754" y="274" text-anchor="middle">fd 2</text>
  <rect class="ready" x="810" y="244" width="88" height="48" rx="10"/><text class="label" x="854" y="274" text-anchor="middle">fd 3</text>
  <rect class="idle" x="910" y="244" width="88" height="48" rx="10"/><text class="label" x="954" y="274" text-anchor="middle">fd N</text>
  <path class="arrow" d="M854 298V337"/>
  <rect class="ready" x="690" y="347" width="326" height="50" rx="12"/>
  <text class="label" x="853" y="378" text-anchor="middle">return ready event: fd 3</text>
  <text class="green" x="602" y="423">Can avoid rescanning a large, mostly idle watched set.</text>

  <rect x="36" y="466" width="1048" height="70" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="label" x="62" y="496">No universal O(1) guarantee:</text>
  <text class="body" x="288" y="496">registration, wakeups, number of ready events, and app work still cost time.</text>
  <text class="small" x="62" y="520">select() commonly has an FD_SETSIZE limit; poll() avoids that fixed bit-set limit. Kernel/process limits apply to all.</text>
</svg>
