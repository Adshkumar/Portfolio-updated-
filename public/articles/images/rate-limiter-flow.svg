<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">How a rate limiter admits or rejects a request</title>
  <desc id="desc">An authenticated request is matched to a quota key and policy. The gateway checks and updates quota state, which may be local or shared. A request with available quota reaches the application; an exhausted quota is rejected with HTTP 429 and may include Retry-After.</desc>
  <defs>
    <marker id="rl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="rl-red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{fill:#0f172a;font:700 28px system-ui,sans-serif}.heading{fill:#0f172a;font:700 20px system-ui,sans-serif}.label{fill:#334155;font:600 16px system-ui,sans-serif}.body{fill:#475569;font:15px system-ui,sans-serif}.small{fill:#64748b;font:14px system-ui,sans-serif}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.amber{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.red{fill:#fef2f2;stroke:#f87171;stroke-width:2}.arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#rl-arrow)}.reject{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#rl-red-arrow)}.green-text{fill:#15803d;font:700 16px system-ui,sans-serif}.red-text{fill:#b91c1c;font:700 16px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" rx="24"/>
  <text class="title" x="40" y="52">A quota check is a decision before backend work</text>
  <text class="body" x="40" y="82">Authenticate first, identify the quota, update its state, then allow or reject the request.</text>

  <rect class="panel" x="36" y="112" width="240" height="134" rx="18"/>
  <text class="heading" x="60" y="151">1 · Request</text>
  <text class="body" x="60" y="181">Caller + operation</text>
  <text class="small" x="60" y="210">e.g. tenant Acme / search</text>

  <rect class="panel" x="326" y="112" width="320" height="134" rx="18"/>
  <text class="heading" x="350" y="151">2 · Match a policy</text>
  <text class="body" x="350" y="181">Verified identity + route</text>
  <text class="small" x="350" y="210">selects the quota key and limit</text>

  <rect class="panel" x="696" y="112" width="388" height="134" rx="18"/>
  <text class="heading" x="720" y="151">3 · Evaluate quota state</text>
  <text class="body" x="720" y="181">Local memory or a shared store</text>
  <text class="small" x="720" y="210">e.g. refill tokens, then consume one</text>

  <path class="arrow" d="M276 178H320"/>
  <path class="arrow" d="M646 178H690"/>

  <rect class="amber" x="326" y="282" width="758" height="112" rx="18"/>
  <text class="heading" x="352" y="321">Token bucket example</text>
  <rect class="green" x="352" y="340" width="210" height="34" rx="8"/>
  <rect class="green" x="570" y="340" width="210" height="34" rx="8"/>
  <rect class="green" x="788" y="340" width="210" height="34" rx="8"/>
  <text class="small" x="352" y="387">Capacity sets the burst size</text>
  <text class="small" x="700" y="387">Refill rate sets the long-term pace</text>
  <path class="arrow" d="M890 246V270"/>

  <rect class="green" x="54" y="432" width="470" height="86" rx="16"/>
  <text class="green-text" x="82" y="468">Quota available → allow</text>
  <text class="body" x="82" y="496">Forward request to the application.</text>
  <rect class="red" x="596" y="432" width="470" height="86" rx="16"/>
  <text class="red-text" x="624" y="468">Quota exhausted → reject</text>
  <text class="body" x="624" y="496">Return 429; include Retry-After when useful.</text>
  <path class="arrow" d="M790 394C730 418 512 416 420 428"/>
  <path class="reject" d="M970 394C1000 411 1006 414 1006 428"/>
</svg>
