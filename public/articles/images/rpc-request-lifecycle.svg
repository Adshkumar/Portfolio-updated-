<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">An RPC request and response cross a network boundary</title>
  <desc id="desc">The client application calls a local stub, which serializes a request and sends it over a network. The server runtime decodes and dispatches it to a handler. The response travels back, but network, server, or timeout errors may interrupt the call.</desc>
  <defs>
    <marker id="rpc-request-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="rpc-response-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <style>
      .bg{fill:#f8fafc}.zone-client{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.zone-server{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{fill:#0f172a;font:700 28px system-ui,sans-serif}.zone-title{fill:#0f172a;font:700 20px system-ui,sans-serif}.label{fill:#334155;font:600 16px system-ui,sans-serif}.body{fill:#475569;font:15px system-ui,sans-serif}.small{fill:#64748b;font:14px system-ui,sans-serif}.net{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.request{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#rpc-request-arrow)}.response{fill:none;stroke:#16a34a;stroke-width:3;marker-end:url(#rpc-response-arrow)}.warn{fill:#fff1f2;stroke:#fda4af;stroke-width:2}.warn-text{fill:#be123c;font:600 15px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" rx="24"/>
  <text class="title" x="40" y="52">An RPC looks local; its execution is remote</text>
  <text class="body" x="40" y="82">The client and server runtimes turn a method call into a request/response exchange.</text>

  <rect class="zone-client" x="36" y="112" width="330" height="330" rx="18"/>
  <text class="zone-title" x="60" y="150">Client process</text>
  <rect class="node" x="64" y="174" width="274" height="78" rx="12"/>
  <text class="label" x="84" y="205">Application</text>
  <text class="body" x="84" y="231">calls reserve(accountId)</text>
  <rect class="node" x="64" y="306" width="274" height="92" rx="12"/>
  <text class="label" x="84" y="338">Client stub / runtime</text>
  <text class="body" x="84" y="365">serialize request · send · await</text>
  <path class="request" d="M200 254V298"/>
  <text class="small" x="216" y="281">method call</text>

  <rect class="net" x="400" y="146" width="320" height="270" rx="18"/>
  <text class="zone-title" x="560" y="183" text-anchor="middle">Network boundary</text>
  <text class="body" x="560" y="211" text-anchor="middle">bytes cross between processes</text>
  <path class="request" d="M338 330H770"/>
  <rect x="454" y="296" width="212" height="30" rx="8" fill="#fff" stroke="#bfdbfe"/>
  <text class="small" x="560" y="316" text-anchor="middle">request + metadata</text>
  <path class="response" d="M770 380H338"/>
  <rect x="454" y="388" width="212" height="30" rx="8" fill="#fff" stroke="#bbf7d0"/>
  <text class="small" x="560" y="408" text-anchor="middle">response or error status</text>

  <rect class="zone-server" x="754" y="112" width="330" height="330" rx="18"/>
  <text class="zone-title" x="778" y="150">Server process</text>
  <rect class="node" x="782" y="174" width="274" height="92" rx="12"/>
  <text class="label" x="802" y="206">Server runtime</text>
  <text class="body" x="802" y="234">receive · decode · dispatch</text>
  <rect class="node" x="782" y="306" width="274" height="78" rx="12"/>
  <text class="label" x="802" y="337">Application handler</text>
  <text class="body" x="802" y="363">runs reserve logic</text>
  <path class="request" d="M919 268V298"/>
  <text class="small" x="934" y="289">invoke</text>

  <rect class="warn" x="36" y="470" width="1048" height="58" rx="14"/>
  <text class="warn-text" x="60" y="505">Unlike a local call, an RPC can time out or fail after the server has already performed the operation.</text>
</svg>
