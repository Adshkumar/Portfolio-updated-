<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="tcp-title tcp-desc">
  <title id="tcp-title">TCP Kernel Buffer Anatomy and Handshake</title>
  <desc id="tcp-desc">Visualization of TCP sockets showing receive and send ring buffers, window scale, sequence offsets, and kernel socket states.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker>
    <style>
      .bg{fill:#0a0a0a}.card{fill:#141414;stroke:#404040;stroke-width:1.5}.title{fill:#fff;font:700 20px system-ui,sans-serif}.header{fill:#38bdf8;font:700 16px system-ui,sans-serif}.txt{fill:#e5e5e5;font:500 13px system-ui,sans-serif}.sub{fill:#a3a3a3;font:12px system-ui,sans-serif}.buf{fill:#1e293b;stroke:#38bdf8;stroke-width:1}.buf-ack{fill:#065f46;stroke:#10b981;stroke-width:1}.buf-unack{fill:#854d0e;stroke:#eab308;stroke-width:1}.buf-unsent{fill:#374151;stroke:#6b7280;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="960" height="300" rx="18"/>
  <text class="title" x="30" y="38">TCP Kernel Architecture: Ring Buffers, Sliding Windows &amp; Backpressure</text>

  <!-- Left: Socket Buffer Layout -->
  <rect class="card" x="30" y="65" width="460" height="205" rx="12"/>
  <text class="header" x="50" y="95">Kernel Send Buffer (sk_buff Queue)</text>
  
  <rect class="buf-ack" x="50" y="115" width="120" height="40" rx="4"/>
  <text class="txt" x="65" y="140">Sent &amp; ACKed</text>

  <rect class="buf-unack" x="175" y="115" width="130" height="40" rx="4"/>
  <text class="txt" x="185" y="140">In-Flight (UnACKed)</text>

  <rect class="buf-unsent" x="310" y="115" width="150" height="40" rx="4"/>
  <text class="txt" x="330" y="140">Queued (Unsent)</text>

  <text class="sub" x="50" y="180">Sliding Window Size (rwnd) advertised by receiver TCP header</text>
  <text class="txt" x="50" y="205">• SO_SNDBUF / SO_RCVBUF autotuned by tcp_wmem / tcp_rmem</text>
  <text class="txt" x="50" y="228">• Full receiver buffer triggers zero-window probe backpressure</text>
  <text class="txt" x="50" y="250">• TIME_WAIT state (2 * MSL) prevents cross-connection collisions</text>

  <!-- Right: Connection Handshake & Lifecycle -->
  <rect class="card" x="510" y="65" width="420" height="205" rx="12"/>
  <text class="header" x="530" y="95">Lifecycle &amp; Latency Costs</text>
  <text class="txt" x="530" y="125">• 3-Way Handshake: SYN ──&gt; SYN-ACK ──&gt; ACK (1 RTT)</text>
  <text class="txt" x="530" y="148">• TLS 1.3 Handshake: ClientHello + Keys (1 RTT)</text>
  <text class="txt" x="530" y="171">• Slow-Start (cwnd): Initial Congestion Window = 10 MSS</text>
  <text class="txt" x="530" y="194">• Nagle's Algorithm (TCP_NODELAY): Buffers tiny packets</text>
  <text class="txt" x="530" y="217">• Ephemeral Port Exhaustion: SO_REUSEADDR / SO_REUSEPORT</text>
  <text class="sub" x="530" y="245">Kernel allocates ~4KB–64KB per active socket sk_buff</text>
</svg>
