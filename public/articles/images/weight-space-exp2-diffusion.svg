<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Experiment 2: inferring a diffusion model's output from weights</title>
  <desc id="desc">A small diffusion denoiser maps a noisy 12 by 12 grayscale image and a time embedding to a clean image. Astra inspected the network weights without a forward pass and identified the shape category, but described filled shapes as outlines.</desc>
  <defs>
    <marker id="e2-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9299a1"/></marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d1d5db;stroke-width:2}.soft{fill:#f1f3f5;stroke:#b7bdc4;stroke-width:2}.green{fill:#e9f7f0;stroke:#11875d;stroke-width:2}.title{fill:#111827;font:700 25px system-ui,sans-serif}.head{fill:#111827;font:700 19px system-ui,sans-serif}.text{fill:#374151;font:16px system-ui,sans-serif}.small{fill:#667085;font:14px system-ui,sans-serif}.arrow{fill:none;stroke:#9299a1;stroke-width:3;marker-end:url(#e2-arrow)}.flow{fill:none;stroke:#11875d;stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;animation:flow 1.8s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
    </style>
  </defs>
  <rect class="bg" width="1000" height="340" rx="18"/>
  <text class="title" x="30" y="40">Can the denoiser's parameters reveal what it draws?</text>
  <rect class="card" x="30" y="70" width="235" height="205" rx="14"/>
  <text class="head" x="50" y="105">Noisy input + time</text>
  <g transform="translate(66 125)" fill="#b7bdc4">
    <rect width="18" height="18"/><rect x="22" width="18" height="18" fill="#e5e7eb"/><rect x="44" width="18" height="18" fill="#9299a1"/><rect x="66" width="18" height="18" fill="#d1d5db"/><rect x="88" width="18" height="18" fill="#9ca3af"/>
    <rect y="22" width="18" height="18" fill="#e5e7eb"/><rect x="22" y="22" width="18" height="18" fill="#9ca3af"/><rect x="44" y="22" width="18" height="18" fill="#d1d5db"/><rect x="66" y="22" width="18" height="18"/><rect x="88" y="22" width="18" height="18" fill="#e5e7eb"/>
    <rect y="44" width="18" height="18" fill="#9299a1"/><rect x="22" y="44" width="18" height="18"/><rect x="44" y="44" width="18" height="18" fill="#e5e7eb"/><rect x="66" y="44" width="18" height="18" fill="#b7bdc4"/><rect x="88" y="44" width="18" height="18"/>
  </g>
  <text class="small" x="50" y="225">12 × 12 pixels + diffusion step</text>
  <text class="small" x="50" y="250">Weights inspected as text</text>
  <rect class="card" x="350" y="70" width="285" height="205" rx="14"/>
  <text class="head" x="370" y="105">Denoiser weights</text>
  <text class="text" x="370" y="132">160 → 64 → 64 → 144</text>
  <g fill="#e2e5e9" stroke="#9299a1" stroke-width="2">
    <circle cx="390" cy="170" r="9"/><circle cx="390" cy="205" r="9"/><circle cx="390" cy="240" r="9"/>
    <circle cx="472" cy="160" r="9"/><circle cx="472" cy="187" r="9"/><circle cx="472" cy="214" r="9"/><circle cx="472" cy="241" r="9"/>
    <circle cx="552" cy="170" r="9"/><circle cx="552" cy="205" r="9"/><circle cx="552" cy="240" r="9"/>
  </g>
  <path d="M399 170L463 187L543 205M399 205L463 214L543 205M399 240L463 241L543 240" fill="none" stroke="#11875d" stroke-width="3" class="flow"/>
  <text class="small" x="370" y="263">No network execution permitted</text>
  <path d="M270 172H340M640 172H700" class="arrow"/><path d="M270 172H340M640 172H700" class="flow"/>
  <rect class="green" x="710" y="70" width="260" height="205" rx="14"/>
  <text class="head" x="730" y="105">Shape clue + caveat</text>
  <circle cx="785" cy="177" r="45" fill="#11875d" class="pulse"/>
  <text class="text" x="850" y="157">Filled shape</text>
  <path d="M849 184H930" stroke="#9299a1" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="small" x="730" y="240">Astra named the category,</text>
  <text class="small" x="730" y="261">but sketched outlines, not fills.</text>
  <text class="small" x="30" y="315">The miss shows why a weight-based interpretation still needs behavioral validation.</text>
</svg>
