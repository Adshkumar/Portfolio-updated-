<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How an LLM can program in neural-network weight space</title>
  <desc id="desc">A task goal and model checkpoint go to an LLM, which inspects parameter structure and proposes a weight patch or a new network. The candidate is evaluated. An optional Python sandbox can inspect tensors and run forward passes, returning observations to the LLM; it does not provide gradients or perform training.</desc>
  <defs>
    <marker id="wsp-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#69727d"/>
    </marker>
    <marker id="wsp-arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#11875d"/>
    </marker>
    <marker id="wsp-arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9299a1"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:#f1f3f5;stroke:#9aa0a6;stroke-width:2}
      .purple{fill:#f1f3f5;stroke:#9aa0a6;stroke-width:2}
      .green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}
      .amber{fill:#f1f3f5;stroke:#c4c9cf;stroke-width:2}
      .title{fill:#0f172a;font:700 29px system-ui,sans-serif}
      .heading{fill:#0f172a;font:700 20px system-ui,sans-serif}
      .label{fill:#334155;font:600 16px system-ui,sans-serif}
      .body{fill:#475569;font:15px system-ui,sans-serif}
      .small{fill:#64748b;font:14px system-ui,sans-serif}
      .blue-arrow{fill:none;stroke:#69727d;stroke-width:3;marker-end:url(#wsp-arrow-blue)}
      .green-arrow{fill:none;stroke:#11875d;stroke-width:3;marker-end:url(#wsp-arrow-green)}
      .amber-arrow{fill:none;stroke:#9299a1;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#wsp-arrow-amber)}
      .node{fill:#e2e5e9;stroke:#8b929a;stroke-width:2}
      .edge{stroke:#9299a1;stroke-width:2}
      .flow-blue{fill:none;stroke:#9299a1;stroke-width:4;stroke-dasharray:2 13;stroke-linecap:round;animation:flow 1.8s linear infinite}
      .flow-green{fill:none;stroke:#35a779;stroke-width:4;stroke-dasharray:2 13;stroke-linecap:round;animation:flow 1.8s linear infinite}
      .flow-amber{fill:none;stroke:#a7adb4;stroke-width:4;stroke-dasharray:2 13;stroke-linecap:round;animation:flow 1.8s linear infinite}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-30}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.16)}}
      @media (prefers-reduced-motion:reduce){.flow-blue,.flow-green,.flow-amber,.pulse{animation:none}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="title" x="40" y="52">A language model can treat weights as the program</text>
  <text class="body" x="40" y="82">Inspect parameters → reason about a change → write a candidate → test the resulting network.</text>

  <rect class="panel" x="36" y="132" width="240" height="270" rx="18"/>
  <text class="heading" x="58" y="171">1. Goal + model</text>
  <rect class="amber" x="58" y="192" width="196" height="72" rx="12"/>
  <text class="label" x="76" y="222">Task description</text>
  <text class="small" x="76" y="247">e.g. stop reasoning loops</text>
  <rect class="blue" x="58" y="279" width="196" height="82" rx="12"/>
  <text class="label" x="76" y="310">Checkpoint weights</text>
  <text class="small" x="76" y="335">+ architecture / tensors</text>
  <text class="small" x="58" y="385">Weights are the target object</text>

  <rect class="purple" x="329" y="132" width="300" height="270" rx="18"/>
  <text class="heading" x="351" y="171">2. LLM reasons in weight space</text>
  <text class="body" x="351" y="202">Map tensor patterns to model behavior</text>
  <line class="edge" x1="386" y1="256" x2="444" y2="239"/>
  <line class="edge" x1="386" y1="256" x2="444" y2="294"/>
  <line class="edge" x1="444" y1="239" x2="501" y2="267"/>
  <line class="edge" x1="444" y1="294" x2="501" y2="267"/>
  <line class="edge" x1="501" y1="267" x2="562" y2="239"/>
  <line class="edge" x1="501" y1="267" x2="562" y2="294"/>
  <circle class="node pulse" cx="386" cy="256" r="13"/>
  <circle class="node" cx="444" cy="239" r="13"/>
  <circle class="node" cx="444" cy="294" r="13"/>
  <circle class="node pulse" cx="501" cy="267" r="13" style="fill:#b8e3d1;stroke:#11875d"/>
  <circle class="node" cx="562" cy="239" r="13"/>
  <circle class="node" cx="562" cy="294" r="13"/>
  <text class="small" x="351" y="339">Direct numerical / structural reasoning</text>
  <text class="small" x="351" y="365">may be tool-free or tool-assisted</text>
  <text class="small" x="351" y="389">depends on the experiment</text>

  <rect class="blue" x="681" y="132" width="218" height="270" rx="18"/>
  <text class="heading" x="703" y="171">3. Write candidate</text>
  <rect class="panel" x="703" y="196" width="174" height="72" rx="10"/>
  <text class="label" x="721" y="227">Weight patch</text>
  <text class="small" x="721" y="250">or new parameters</text>
  <path d="M721 290h136M721 308h92M721 326h120M721 344h74" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="703" y="384">Small does not mean safe</text>

  <rect class="green" x="951" y="132" width="213" height="270" rx="18"/>
  <text class="heading" x="973" y="171">4. Evaluate</text>
  <text class="body" x="973" y="204">Load the candidate</text>
  <text class="body" x="973" y="232">Run held-out tests</text>
  <rect class="panel" x="973" y="251" width="169" height="72" rx="10"/>
  <text class="small" x="991" y="280">quality + regressions</text>
  <text class="small" x="991" y="304">+ safety checks</text>
  <text class="label" x="973" y="356">Keep or reject</text>
  <text class="small" x="973" y="383">Never assume it works</text>

  <path class="blue-arrow" d="M276 267H321"/>
  <path class="blue-arrow" d="M629 267H673"/>
  <path class="green-arrow" d="M899 267H943"/>
  <path class="flow-blue" d="M276 267H321"/>
  <path class="flow-blue" d="M629 267H673"/>
  <path class="flow-green" d="M899 267H943"/>

  <rect class="amber" x="329" y="454" width="570" height="126" rx="18"/>
  <text class="heading" x="353" y="491">Optional: sandboxed analysis and feedback</text>
  <text class="body" x="353" y="522">Python can inspect tensors or run forward passes on examples.</text>
  <text class="small" x="353" y="551">Observed here: still no gradient descent or training loop.</text>
  <path class="amber-arrow" d="M479 402C479 430 506 430 506 446"/>
  <path class="amber-arrow" d="M680 454C680 427 549 430 549 410"/>
  <path class="flow-amber" d="M479 402C479 430 506 430 506 446"/>
  <path class="flow-amber" d="M680 454C680 427 549 430 549 410"/>

  <rect class="panel" x="951" y="454" width="213" height="126" rx="18"/>
  <text class="heading" x="973" y="491">Key distinction</text>
  <text class="small" x="973" y="522">No gradients ≠ no feedback</text>
  <text class="small" x="973" y="549">Practice data ≠ test data</text>

  <line class="blue-arrow" x1="40" y1="617" x2="88" y2="617"/>
  <text class="small" x="101" y="622">Direct reasoning / candidate flow</text>
  <line class="amber-arrow" x1="382" y1="617" x2="430" y2="617"/>
  <text class="small" x="443" y="622">Optional sandbox loop</text>
  <text class="small" x="736" y="622">Conceptual overview; reported experiments use different harnesses.</text>
</svg>
